name: Windows Build & Release

# 真实 Windows x64 构建：pytest（含 OCR）→ PyInstaller one-dir → 打包产物自检
# → Inno Setup 安装包 → 便携 zip / SHA-256 → artifact；tag 或手动触发可发 Release。
#
# 触发：
#   * push / PR：构建并上传 artifact（不发布 Release）
#   * push tag v*：构建并发布 Release（附安装包、便携 zip、sha256）
#   * workflow_dispatch：可勾选 publish_release 手动发布（tag 默认 v<version>）

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '发布 GitHub Release（使用 tag v<版本号>）'
        type: boolean
        default: false
      release_tag:
        description: '自定义 Release tag（留空则自动使用 v<版本号>）'
        type: string
        default: ''

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'
  QT_QPA_PLATFORM: 'offscreen'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUTF8: '1'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Windows x64 构建与自检
    # Windows Server 2022 镜像自带 Inno Setup 6.7.x；windows-latest 已迁移到
    # Server 2025，部分镜像尚未预装 Inno Setup。构建产物仍是 Windows x64。
    runs-on: windows-2022
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }} (x64)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          # 以无依赖方式安装本项目（不覆盖 requirements 锁定的版本），
          # 让 pytest / collect_licenses 能识别 engineerdiff 发行包。
          python -m pip install -e . --no-deps
          python -m pip list

      - name: Dependency assertions (单一 OpenCV / 版本 / OCR 模型)
        shell: pwsh
        run: python scripts/check_deps.py

      - name: Static packaging checks
        shell: pwsh
        run: python scripts/check_spec.py

      - name: Run pytest (full suite, includes OCR tests, offscreen)
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest -q

      - name: Ensure Inno Setup 6 (ISCC.exe)
        id: inno
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:RUNNER_TEMP 'InnoSetup6\ISCC.exe')
          )
          $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) {
            # windows-latest/windows-2022 镜像在 2025 后可能不再预装 Inno Setup；
            # 从官方 GitHub Release 下载固定版本，安装到 runner 临时目录。
            $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
            $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
            Write-Host "下载 Inno Setup：$url"
            Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing -TimeoutSec 180
            Write-Host ("安装包大小：{0}" -f (Get-Item -LiteralPath $setup).Length)
            $target = Join-Path $env:RUNNER_TEMP 'InnoSetup6'
            $p = Start-Process -FilePath $setup -ArgumentList @(
              '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/ALLUSERS',"/DIR=`"$target`""
            ) -Wait -PassThru
            Write-Host "Inno Setup 安装退出码：$($p.ExitCode)"
            $iscc = Join-Path $target 'ISCC.exe'
            if (-not (Test-Path -LiteralPath $iscc)) {
              $p2 = Start-Process -FilePath $setup -ArgumentList @(
                '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER'
              ) -Wait -PassThru
              Write-Host "Inno Setup current-user 安装退出码：$($p2.ExitCode)"
              $iscc = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
            }
          }
          if (-not $iscc -or -not (Test-Path -LiteralPath $iscc)) {
            Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName | Write-Host
            throw '无法获取 Inno Setup ISCC.exe'
          }
          # 注意：Inno Setup 的 ISCC.exe 版本资源可能为 0.0.0.0，不能据此拒绝；
          # 是否存在/可执行由 ISCC 编译步骤实际验证。
          $probe = & $iscc /? 2>&1 | Select-Object -First 3
          Write-Host ($probe -join "`n")
          "iscc=$iscc" >> $env:GITHUB_OUTPUT
          Write-Host "ISCC = $iscc"

      - name: Build, verify bundle and create installer
        id: build
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/build_windows.ps1 -SkipTests -IsccPath "${{ steps.inno.outputs.iscc }}"
          if ($LASTEXITCODE -ne 0) { throw "构建脚本失败（exit=$LASTEXITCODE）" }
          $version = (python -c "import sys; sys.path.insert(0, 'src'); from engineerdiff import version; print(version.__version__)").Trim()
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check self-test report (exit code + report)
        shell: pwsh
        run: |
          $reportPath = 'build\self-test-report.json'
          if (-not (Test-Path $reportPath)) { throw "未找到自检报告：$reportPath" }
          $report = Get-Content $reportPath -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $report.ok) {
            Write-Host ($report | ConvertTo-Json -Depth 6)
            throw "self-test 报告 ok=false：$($report.error)"
          }
          if (-not $report.checks -or $report.checks.Count -lt 5) {
            throw "self-test 检查项过少：$($report.checks.Count)"
          }
          Write-Host "self-test 报告：ok=$($report.ok) version=$($report.version) frozen=$($report.frozen) 检查项=$($report.checks.Count)"
          $report.checks | ForEach-Object { Write-Host ("  [{0}] {1}: {2}" -f ($(if ($_.ok) { 'PASS' } else { 'FAIL' })), $_.name, $_.detail) }
          # 报告必须来自打包产物（frozen=true）
          if (-not $report.frozen) { throw "self-test 未运行于打包产物（frozen=$($report.frozen)）" }

      - name: Show artifacts
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length, LastWriteTime
          Get-Content release\sha256sums.txt

      - name: Installer smoke test (silent install -> self-test -> uninstall)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path release -Filter 'EngineerDiff-*-Setup-x64.exe' -File | Select-Object -First 1
          if (-not $installer) { throw '未找到安装包' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\EngineerDiff'
          $installedExe = Join-Path $installDir 'EngineerDiff.exe'
          if (Test-Path -LiteralPath $installDir) { throw "安装目录已存在，构建机不干净：$installDir" }

          # 1) 静默安装（默认 per-user，无需管理员）
          Write-Host "静默安装：$($installer.FullName) -> $installDir"
          $proc = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$installDir`"" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "安装失败，exit=$($proc.ExitCode)" }
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "安装后未找到 $installedExe" }

          # 2) 安装目录内容断言：离线 OCR 模型、Qt 平台插件、VC++ 运行库、文档/许可证
          $models = @(Get-ChildItem -Path $installDir -Recurse -Filter '*.onnx' -File)
          if ($models.Count -lt 3) { throw "安装目录 OCR 模型不足 3 个：$($models.Name -join ', ')" }
          if (-not (Get-ChildItem -Path $installDir -Recurse -Filter 'qwindows.dll' -File | Select-Object -First 1)) {
            throw '安装目录缺少 Qt qwindows.dll 平台插件'
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Get-ChildItem -Path $installDir -Recurse -Filter $dll -File | Select-Object -First 1)) {
              throw "安装目录缺少 VC++ 运行库 $dll"
            }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'docs\user-guide.md'))) { throw '安装目录缺少 docs\user-guide.md' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'docs\windows-defender.md'))) { throw '安装目录缺少 docs\windows-defender.md' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'docs\screenshots\text-compare.png'))) { throw '安装目录缺少 docs\screenshots 截图' }
          if (-not (Test-Path -LiteralPath (Join-Path $installDir 'LICENSES\MANIFEST.json'))) { throw '安装目录缺少 LICENSES\MANIFEST.json' }
          Write-Host "安装目录 OCR 模型：$($models.Name -join ', ')"

          # 3) 安装后的 self-test：显式报告路径，断言退出码 + ok + frozen
          $report = Join-Path $env:GITHUB_WORKSPACE 'build\installed-self-test.json'
          Remove-Item -LiteralPath $report -ErrorAction SilentlyContinue
          Write-Host "运行安装后自检：$installedExe --self-test --self-test-report $report"
          $st = Start-Process -FilePath $installedExe `
            -ArgumentList "--self-test --self-test-report `"$report`"" `
            -WorkingDirectory $env:GITHUB_WORKSPACE -Wait -PassThru
          if (-not (Test-Path -LiteralPath $report)) { throw "安装后 self-test 未生成报告：$report（exit=$($st.ExitCode)）" }
          if ($st.ExitCode -ne 0) { throw "安装后 self-test 退出码非 0：$($st.ExitCode)" }
          $json = Get-Content -LiteralPath $report -Raw -Encoding utf8 | ConvertFrom-Json
          if (-not $json.ok) { throw "安装后 self-test 报告 ok=false：$($json.error)" }
          if (-not $json.frozen) { throw "安装后 self-test 未运行于打包产物（frozen=$($json.frozen)）" }
          if ($json.checks.Count -lt 5) { throw '安装后 self-test 检查项过少' }
          Write-Host "安装后自检通过：version=$($json.version) checks=$($json.checks.Count) frozen=$($json.frozen)"

          # 4) 静默卸载并断言程序与安装目录被移除
          $uninstaller = Get-ChildItem -Path $installDir -Filter 'unins*.exe' -File | Select-Object -First 1
          if (-not $uninstaller) { throw '未找到卸载程序 unins*.exe' }
          Write-Host "静默卸载：$($uninstaller.FullName)"
          $up = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($up.ExitCode -ne 0) { throw "卸载失败，exit=$($up.ExitCode)" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path -LiteralPath $installedExe) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installedExe) { throw "卸载后仍存在：$installedExe" }
          while ((Test-Path -LiteralPath $installDir) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Milliseconds 500 }
          if (Test-Path -LiteralPath $installDir) {
            $left = Get-ChildItem -LiteralPath $installDir -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 20
            throw "卸载后安装目录仍存在（剩余：$($left.Name -join ', ')）"
          }
          Write-Host '安装 / 安装后自检 / 卸载 冒烟测试通过。'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EngineerDiff-windows-x64
          path: |
            release/EngineerDiff-*-Setup-x64.exe
            release/EngineerDiff-*-portable-win64.zip
            release/sha256sums.txt
            build/windows-build-summary.json
            build/verify-bundle.json
            build/self-test-report.json
            build/installed-self-test.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (python -c "import sys; sys.path.insert(0, 'src'); from engineerdiff import version; print(version.__version__)").Trim()
          $tag = if ('${{ inputs.release_tag }}') { '${{ inputs.release_tag }}' } elseif ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { "v$version" }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Release tag 不合法：$tag（应形如 v1.0.0）" }
          if ($tag -ne "v$version") { throw "Release tag $tag 与版本号 v$version 不一致，请先同步 version.py / pyproject.toml / packaging" }

          $files = @()
          $files += Get-ChildItem -Path release -Filter "EngineerDiff-*-Setup-x64.exe" -File | ForEach-Object { $_.FullName }
          $files += Get-ChildItem -Path release -Filter "EngineerDiff-*-portable-win64.zip" -File | ForEach-Object { $_.FullName }
          $files += (Resolve-Path 'release\sha256sums.txt').Path
          if ($files.Count -lt 2) { throw '缺少安装包/便携包，无法发布 Release' }

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "创建 Release：$tag"
            gh release create $tag --target '${{ github.sha }}' --title "EngineerDiff $version（Windows x64）" --notes "EngineerDiff $version Windows x64 安装包与便携版。安装包为 per-user 安装（无需管理员），内置离线 OCR 模型。详见随包 docs/user-guide.md。"
            if ($LASTEXITCODE -ne 0) { throw "创建 Release 失败：$tag" }
          }
          Write-Host "上传 Release 资产：$($files -join ', ')"
          gh release upload $tag $files --clobber
          if ($LASTEXITCODE -ne 0) { throw '上传 Release 资产失败' }
          Write-Host "Release 已发布：$tag"

      - name: Release summary
        if: always()
        shell: pwsh
        run: |
          $summary = 'build\windows-build-summary.json'
          if (Test-Path $summary) { Get-Content $summary -Raw }
