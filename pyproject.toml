[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineerdiff"
version = "1.1.0"
description = "EngineerDiff — Windows 本地多格式文件差异比较工具"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "EngineerDiff contributors" }]
keywords = ["diff", "excel", "ocr", "windows", "desktop", "engineering"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Topic :: Utilities",
]
dependencies = [
  "PySide6==6.8.1",
  "Pillow>=10.4,<12",
  "numpy>=1.26,<2.3",
  "opencv-python==4.10.0.84",
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime==1.20.1",
  "openpyxl>=3.1.5,<3.2",
  "xlrd>=2.0.1,<3",
  "charset-normalizer>=3.3,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "xlwt>=1.3.0,<2",
  "pyinstaller>=6.11,<7",
]
build = [
  "pyinstaller>=6.11,<7",
]

[project.scripts]
engineerdiff = "engineerdiff.app:main"

[project.gui-scripts]
engineerdiff-gui = "engineerdiff.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineerdiff = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "ocr: 需要 RapidOCR 模型与较长时间",
  "gui: 需要 Qt（使用 offscreen 平台）",
]

[tool.ruff]
line-length = 110
target-version = "py311"
